<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#0a120e"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#d97706" stroke-width="6" opacity="0.4"/>
  
  <!-- Die 1 (Left, 5 pips) -->
  <g transform="translate(110, 160) rotate(-8, 110, 110)">
    <rect width="130" height="130" rx="22" fill="#dc2626" stroke="#b91c1c" stroke-width="4"/>
    <!-- High gloss overlay -->
    <path d="M 10 10 L 120 10 C 125 10, 125 40, 10 70 Z" fill="#ffffff" opacity="0.2"/>
    <!-- Pips -->
    <circle cx="33" cy="33" r="11" fill="#ffffff"/>
    <circle cx="97" cy="33" r="11" fill="#ffffff"/>
    <circle cx="65" cy="65" r="11" fill="#ffffff"/>
    <circle cx="33" cy="97" r="11" fill="#ffffff"/>
    <circle cx="97" cy="97" r="11" fill="#ffffff"/>
  </g>

  <!-- Die 2 (Right, 6 pips) -->
  <g transform="translate(260, 180) rotate(12, 110, 110)">
    <rect width="130" height="130" rx="22" fill="#dc2626" stroke="#b91c1c" stroke-width="4"/>
    <!-- High gloss overlay -->
    <path d="M 10 10 L 120 10 C 125 10, 125 40, 10 70 Z" fill="#ffffff" opacity="0.2"/>
    <!-- Pips -->
    <circle cx="33" cy="30" r="11" fill="#ffffff"/>
    <circle cx="97" cy="30" r="11" fill="#ffffff"/>
    <circle cx="33" cy="65" r="11" fill="#ffffff"/>
    <circle cx="97" cy="65" r="11" fill="#ffffff"/>
    <circle cx="33" cy="100" r="11" fill="#ffffff"/>
    <circle cx="97" cy="100" r="11" fill="#ffffff"/>
  </g>

  <!-- Title Text -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#f59e0b" text-anchor="middle" letter-spacing="2">CRAPLESS</text>
  <text x="256" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#10b981" text-anchor="middle" letter-spacing="4">CRAPS</text>
</svg>
